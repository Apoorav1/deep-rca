[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-rca"
version = "0.1.0"
description = "Autonomous, hypothesis-driven root-cause investigation over OpenRCA 2.0 (ops-lite) on Azure."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pyarrow>=15",
    "pandas>=2.0",
]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.16",
    "azure-cosmos>=4.5",
    "azure-storage-file-datalake>=12.14",
    "openai>=1.40",            # Azure OpenAI / Foundry chat client
    "agent-framework",          # Microsoft Agent Framework (installed at provisioning)
]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "isolation: ground-truth isolation guarantees (must always pass)",
    "integration: end-to-end loop (may require Azure)",
    "azure: requires provisioned Azure resources",
]
